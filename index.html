    function makeCanSVG(bgFrom, bgTo, bodyColor, accentColor, brand, size) {
      return `
        <svg viewBox="0 0 64 64" class="w-full h-full">
          <rect width="64" height="64" fill="${bgFrom}"/>
          <circle cx="32" cy="34" r="24" fill="${bgTo}" opacity="0.45"/>
          <rect x="20" y="10" width="24" height="4" rx="2" fill="#d4d4d8"/>
          <rect x="20" y="50" width="24" height="4" rx="2" fill="#a1a1aa"/>
          <rect x="19" y="13" width="26" height="38" rx="4" fill="${bodyColor}"/>
          <path d="M19 32 Q26 26 32 31 T45 29 L45 35 Q38 39 32 34 T19 37 Z" fill="${accentColor}" opacity="0.9"/>
          <rect x="22" y="15" width="4" height="34" rx="2" fill="#ffffff" opacity="0.22"/>
          <text x="32" y="25" text-anchor="middle" fill="#ffffff" font-size="7.5" font-weight="800" font-family="sans-serif">${brand}</text>
          <rect x="22" y="40" width="20" height="8" rx="4" fill="#000000" opacity="0.38"/>
          <text x="32" y="46" text-anchor="middle" fill="#ffffff" font-size="6.2" font-weight="700" font-family="sans-serif">${size}</text>
        </svg>`;
    }

    function makeBottleSVG(bgFrom, bgTo, liquidColor, capColor, labelColor, brand, size, isLarge = false) {
      const bw = isLarge ? 26 : 20;
      const bx = (64 - bw) / 2;
      return `
        <svg viewBox="0 0 64 64" class="w-full h-full">
          <rect width="64" height="64" fill="${bgFrom}"/>
          <circle cx="32" cy="36" r="24" fill="${bgTo}" opacity="0.4"/>
          <rect x="27" y="6" width="10" height="5" rx="1.5" fill="${capColor}"/>
          <path d="M28 11 L36 11 L${bx + bw} 21 L${bx} 21 Z" fill="${liquidColor}" opacity="0.92"/>
          <rect x="${bx}" y="20" width="${bw}" height="36" rx="5" fill="${liquidColor}"/>
          <rect x="${bx}" y="28" width="${bw}" height="16" fill="${labelColor}"/>
          <rect x="${bx + 3}" y="22" width="3.5" height="31" rx="1.7" fill="#ffffff" opacity="0.24"/>
          <text x="32" y="35" text-anchor="middle" fill="#ffffff" font-size="${isLarge ? '7.2' : '6.4'}" font-weight="800" font-family="sans-serif">${brand}</text>
          <text x="32" y="42.5" text-anchor="middle" fill="#fef08a" font-size="6.3" font-weight="800" font-family="sans-serif">${size}</text>
        </svg>`;
    }

    function makeSauceBowlSVG(bgColor, sauceColor, highlightColor, garnish = "") {

        <svg viewBox="0 0 64 64" class="w-full h-full">
          <rect width="64" height="64" fill="${bgColor}"/>
          <circle cx="33" cy="34" r="23" fill="#000000" opacity="0.4"/>

          <circle cx="32" cy="32" r="20.5" fill="#d6d3d1"/>
          <circle cx="32" cy="32" r="18.5" fill="${sauceColor}"/>
          <path d="M21 27 A13 13 0 0 1 34 19" fill="none" stroke="${highlightColor}" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
          <circle cx="20" cy="33" r="1.6" fill="${highlightColor}" opacity="0.5"/>
          ${garnish}
        </svg>`;
    }

              <circle cx="32" cy="34" r="24" fill="#0284c7" opacity="0.35"/>

          return makeCanSVG("#2a0909", "#dc2626", "#dc2626", "#ffffff", "COLA", "0.33L");
        case "cola50":
          return makeBottleSVG("#2a0909", "#dc2626", "#23120b", "#dc2626", "#dc2626", "COLA", "0.5L", false);

        case "fanta50":

          return makeCanSVG("#062618", "#16a34a", "#16a34a", "#fde047", "SPRITE", "0.33L");
        case "sprite50":
          return makeBottleSVG("#062618", "#22c55e", "#15803d", "#22c55e", "#16a34a", "SPRITE", "0.5L", false);
        case "water_sparkling":
          return `
            <svg viewBox="0 0 64 64" class="w-full h-full">
              <rect width="64" height="64" fill="#082436"/>
              <circle cx="32" cy="36" r="24" fill="#0ea5e9" opacity="0.35"/>
              <rect x="27" y="6" width="10" height="5" rx="1.5" fill="#0284c7"/>
              <path d="M28 11 L36 11 L42 21 L22 21 Z" fill="#bae6fd" opacity="0.9"/>
              <rect x="22" y="20" width="20" height="36" rx="5" fill="#38bdf8" opacity="0.85"/>
              <rect x="22" y="29" width="20" height="14" fill="#0369a1"/>
              <circle cx="27" cy="24" r="1.4" fill="#ffffff" opacity="0.85"/>
              <circle cx="35" cy="25" r="1.1" fill="#ffffff" opacity="0.8"/>
              <circle cx="31" cy="48" r="1.6" fill="#ffffff" opacity="0.8"/>
              <circle cx="37" cy="51" r="1.2" fill="#ffffff" opacity="0.7"/>
              <text x="32" y="36" text-anchor="middle" fill="#ffffff" font-size="6.8" font-weight="800" font-family="sans-serif">SU</text>
              <text x="32" y="41.5" text-anchor="middle" fill="#bae6fd" font-size="5.2" font-weight="700" font-family="sans-serif">QAZLI</text>
            </svg>`;
        case "water_still":
          return `
            <svg viewBox="0 0 64 64" class="w-full h-full">
              <rect width="64" height="64" fill="#0b1f2e"/>
              <circle cx="32" cy="36" r="24" fill="#38bdf8" opacity="0.28"/>
              <rect x="27" y="6" width="10" height="5" rx="1.5" fill="#38bdf8"/>
              <path d="M28 11 L36 11 L42 21 L22 21 Z" fill="#e0f2fe" opacity="0.9"/>
              <rect x="22" y="20" width="20" height="36" rx="5" fill="#7dd3fc" opacity="0.82"/>
              <rect x="22" y="29" width="20" height="14" fill="#0284c7"/>
              <rect x="25" y="22" width="3" height="31" rx="1.5" fill="#ffffff" opacity="0.35"/>
              <text x="32" y="36" text-anchor="middle" fill="#ffffff" font-size="6.8" font-weight="800" font-family="sans-serif">SU</text>
              <text x="32" y="41.5" text-anchor="middle" fill="#e0f2fe" font-size="4.8" font-weight="700" font-family="sans-serif">QAZSIZ</text>
            </svg>`;
        case "ketchup":
          return makeSauceBowlSVG("#291010", "#dc2626", "#fca5a5");
        case "mayo":
          return makeSauceBowlSVG("#262218", "#fef9c3", "#ffffff",
            `<path d="M26 35 Q32 28 38 34" fill="none" stroke="#fde68a" stroke-width="2" stroke-linecap="round" opacity="0.7"/>`);
        case "shaurma_sauce":
          return makeSauceBowlSVG("#1f2419", "#fef3c7", "#ffffff",
            `<circle cx="27" cy="29" r="1.4" fill="#16a34a"/>
             <circle cx="36" cy="27" r="1.2" fill="#15803d"/>
             <circle cx="33" cy="36" r="1.5" fill="#16a34a"/>
             <circle cx="25" cy="37" r="1.1" fill="#15803d"/>
             <circle cx="39" cy="34" r="1.2" fill="#22c55e"/>
             <circle cx="31" cy="31" r="1" fill="#15803d"/>`);
        case "bbq":
          return makeSauceBowlSVG("#24140d", "#5c1d0c", "#d97706",
            `<circle cx="32" cy="32" r="11" fill="#451408" opacity="0.45"/>`);
        default:
          return "";
      }
    }

    const categoryOrder = ["Combolar", "Dönərlər", "Burgerlər", "Qəlyanaltılar", "İçkilər", "Souslar"];
    let cart = {};
    let currentCategory = "Hamısı";
    let orderType = "Çatdırılma";

    function renderMenu() {
      const container = document.getElementById("menu-list");
      const query = document.getElementById("search-input").value.trim().toLowerCase();

      const filtered = menuItems.filter(item => {
        const matchCat = currentCategory === "Hamısı" || item.cat === currentCategory;
        const matchSearch = !query || item.name.toLowerCase().includes(query) || item.desc.toLowerCase().includes(query);
        return matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<p class="text-center text-neutral-500 py-10 text-sm">Axtarışa uyğun məhsul tapılmadı.</p>`;
        return;
      }

      const catsToShow = currentCategory === "Hamısı"
        ? categoryOrder.filter(c => filtered.some(i => i.cat === c))
        : [currentCategory];

      container.innerHTML = catsToShow.map(cat => {
        const items = filtered.filter(i => i.cat === cat);
        return `
          <section>
            <div class="flex items-center justify-between mb-3">
              <h2 class="text-base font-extrabold text-yellow-400 tracking-wide uppercase">${cat}</h2>
              <span class="text-xs text-neutral-500">${items.length} çeşid</span>
            </div>
            <div class="space-y-3">
              ${items.map(item => renderCard(item)).join("")}
            </div>
          </section>
        `;
      }).join("");
    }

    function renderCard(item) {
      const qty = cart[item.id] || 0;
      let thumb = "";
      if (item.img) {
        thumb = `<img src="${item.img}" alt="${item.name}" class="w-full h-full object-cover" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><div style="display:none" class="w-full h-full items-center justify-center text-2xl">${item.icon || "🍽️"}</div>`;
      } else if (item.art) {
        thumb = getProductArt(item.art);
      } else {
        thumb = `<div class="w-full h-full flex items-center justify-center text-2xl">${item.icon || "🍽️"}</div>`;
      }

      return `
        <div class="bg-neutral-900/90 border ${qty > 0 ? 'border-yellow-400/60' : 'border-neutral-800/90'} rounded-2xl p-3 flex items-center gap-3 transition">
          <div class="w-16 h-16 rounded-xl bg-neutral-800 overflow-hidden shrink-0">
            ${thumb}
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-1.5 flex-wrap">
              <h3 class="font-bold text-white text-sm leading-snug">${item.name}</h3>
              ${item.badge ? `<span class="text-[10px] font-extrabold px-1.5 py-0.5 rounded bg-red-600 text-yellow-300">${item.badge}</span>` : ""}
            </div>
            <p class="text-xs text-neutral-400 mt-0.5 leading-snug">${item.desc}</p>
            <p class="text-yellow-400 font-extrabold text-sm mt-1.5">${item.price.toFixed(2)} AZN</p>
          </div>
          <div class="flex items-center gap-1.5 shrink-0">
            ${qty > 0 ? `
              <button onclick="updateQty(${item.id}, -1)" class="w-8 h-8 rounded-full bg-neutral-800 hover:bg-neutral-700 text-white font-bold">−</button>
              <span class="w-5 text-center text-sm font-extrabold">${qty}</span>
            ` : ""}
            <button onclick="updateQty(${item.id}, 1)" class="w-8 h-8 rounded-full bg-yellow-400 hover:bg-yellow-300 text-neutral-950 font-extrabold text-lg leading-none">+</button>
          </div>
        </div>
      `;
    }

    function filterMenu(category) {
      currentCategory = category;
      document.querySelectorAll(".cat-btn").forEach(btn => {
        const isActive = btn.dataset.cat === category;
        btn.className = isActive
          ? "cat-btn px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap bg-yellow-400 text-neutral-950"
          : "cat-btn px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap bg-neutral-900 text-neutral-300 border border-neutral-800";
      });
      renderMenu();
    }

    function updateQty(id, change) {
      cart[id] = (cart[id] || 0) + change;
      if (cart[id] <= 0) delete cart[id];
      renderMenu();
      updateCartUI();
      if (!document.getElementById("checkout-modal").classList.contains("hidden")) {
        if (Object.keys(cart).length === 0) closeCheckout();
        else renderCheckoutItems();
      }
    }

    function getCartTotals() {
      let totalQty = 0;
      let totalPrice = 0;
      for (const [id, qty] of Object.entries(cart)) {
        const item = menuItems.find(m => m.id == id);
        if (item) {
          totalQty += qty;
          totalPrice += item.price * qty;
        }
      }
      return { totalQty, totalPrice };
    }

    function updateCartUI() {
      const bar = document.getElementById("cart-bar");
      const { totalQty, totalPrice } = getCartTotals();

      if (totalQty > 0) {
        bar.classList.remove("hidden");
        document.getElementById("cart-badge").textContent = totalQty;
        document.getElementById("cart-total").textContent = `${totalPrice.toFixed(2)} AZN`;
        document.getElementById("modal-total").textContent = `${totalPrice.toFixed(2)} AZN`;
      } else {
        bar.classList.add("hidden");
      }
    }

    function openCheckout() {
      renderCheckoutItems();
      document.getElementById("checkout-modal").classList.remove("hidden");
    }

    function closeCheckout() {
      document.getElementById("checkout-modal").classList.add("hidden");
    }

    function setOrderType(type) {
      orderType = type;
      const isDel = type === "Çatdırılma";
      document.getElementById("btn-delivery").className = isDel
        ? "py-2.5 rounded-xl text-xs font-bold bg-yellow-400 text-neutral-950 border border-yellow-400"
        : "py-2.5 rounded-xl text-xs font-bold bg-neutral-950 text-neutral-300 border border-neutral-800";
      document.getElementById("btn-pickup").className = !isDel
        ? "py-2.5 rounded-xl text-xs font-bold bg-yellow-400 text-neutral-950 border border-yellow-400"
        : "py-2.5 rounded-xl text-xs font-bold bg-neutral-950 text-neutral-300 border border-neutral-800";
      document.getElementById("address-input").style.display = isDel ? "block" : "none";
    }

    function renderCheckoutItems() {
      const container = document.getElementById("checkout-items");
      container.innerHTML = Object.entries(cart).map(([id, qty]) => {
        const item = menuItems.find(m => m.id == id);
        return `
          <div class="flex items-center justify-between gap-2 bg-neutral-950 border border-neutral-800 rounded-xl p-3">
            <div class="min-w-0">
              <p class="text-sm font-bold text-white truncate">${item.name}</p>
              <p class="text-xs text-yellow-400 font-semibold">${(item.price * qty).toFixed(2)} AZN</p>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <button onclick="updateQty(${item.id}, -1)" class="w-7 h-7 rounded-full bg-neutral-800 text-white font-bold">−</button>
              <span class="w-4 text-center text-xs font-bold">${qty}</span>
              <button onclick="updateQty(${item.id}, 1)" class="w-7 h-7 rounded-full bg-yellow-400 text-neutral-950 font-bold">+</button>
            </div>
          </div>
        `;
      }).join("");
      updateCartUI();
    }

    function sendWhatsApp() {
      const address = document.getElementById("address-input").value.trim();
      const note = document.getElementById("note-input").value.trim();
      let lines = ["Salam! HAS HATAY onlayn menyusundan sifariş etmək istəyirəm:", ""];
      let total = 0;

      for (const [id, qty] of Object.entries(cart)) {
        const item = menuItems.find(m => m.id == id);
        const subtotal = item.price * qty;
        total += subtotal;
        lines.push(`• ${qty}x ${item.name} — ${subtotal.toFixed(2)} AZN`);
      }

      lines.push("", `💰 Cəmi: ${total.toFixed(2)} AZN`);
      lines.push(`📦 Növ: ${orderType === "Çatdırılma" ? "Pulsuz çatdırılma" : "Özüm götürəcəm"}`);
      if (orderType === "Çatdırılma" && address) lines.push(`📍 Ünvan: ${address}`);
      if (note) lines.push(`📝 Qeyd: ${note}`);

      const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(lines.join("\n"))}`;
      window.open(url, "_blank");
    }

    renderMenu();
  </script>
</body>
</html>
